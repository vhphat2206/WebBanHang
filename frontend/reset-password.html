<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - ADLV Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4">
                <img src="assets/logo-adlv.png" alt="ADLV" class="h-12 mx-auto"/>
            </a>
            <h1 class="text-2xl font-black uppercase tracking-tight">Đặt lại mật khẩu</h1>
            <p class="text-gray-500 text-sm mt-2">Nhập mật khẩu mới cho tài khoản</p>
        </div>

        <div id="noToken" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 text-center">
            <div class="text-red-600 font-bold mb-2">Token không hợp lệ</div>
            <p class="text-sm text-gray-600 mb-3">Link đặt lại không có token. Vui lòng dùng link từ email.</p>
            <a href="forgot-password.html" class="inline-block text-red-600 underline text-sm">Yêu cầu link mới</a>
        </div>

        <form id="resetForm" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Mật khẩu mới</label>
                <input type="password" id="newPassword" required minlength="6"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                    placeholder="Tối thiểu 6 ký tự"/>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" required minlength="6"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                    placeholder="Nhập lại mật khẩu"/>
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-black text-white font-bold uppercase tracking-widest py-3 hover:bg-red-600 transition">
                Đặt lại mật khẩu
            </button>
        </form>

        <div id="success" class="hidden bg-green-50 border border-green-200 rounded-lg p-4 text-center">
            <div class="text-4xl mb-2">✅</div>
            <div class="text-green-700 font-bold mb-2">Đặt lại thành công!</div>
            <p class="text-sm text-gray-600 mb-4">Bạn có thể đăng nhập với mật khẩu mới ngay bây giờ.</p>
            <a href="index.html" class="inline-block bg-black text-white font-bold uppercase px-6 py-2 hover:bg-red-600 transition">
                Đăng nhập ngay
            </a>
        </div>

        <div id="error" class="hidden mt-4 bg-red-50 border border-red-200 rounded-lg p-3 text-red-600 text-sm"></div>
    </div>

    <script>
        const API_HOST = window.location.origin;
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('noToken').classList.remove('hidden');
        } else {
            document.getElementById('resetForm').classList.remove('hidden');
        }

        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');
            const errBox = document.getElementById('error');

            errBox.classList.add('hidden');

            if (newPassword !== confirmPassword) {
                errBox.textContent = 'Mật khẩu xác nhận không khớp';
                errBox.classList.remove('hidden');
                return;
            }

            btn.disabled = true; btn.textContent = 'Đang xử lý...';
            try {
                const r = await fetch(API_HOST + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.message || 'Có lỗi xảy ra');

                document.getElementById('resetForm').classList.add('hidden');
                document.getElementById('success').classList.remove('hidden');
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
                btn.disabled = false; btn.textContent = 'Đặt lại mật khẩu';
            }
        };
    </script>
</body>
</html>
