<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - ADLV Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-block mb-4">
                <img src="assets/logo-adlv.png" alt="ADLV" class="h-12 mx-auto"/>
            </a>
            <h1 class="text-2xl font-black uppercase tracking-tight">Quên mật khẩu</h1>
            <p class="text-gray-500 text-sm mt-2">Nhập email đã đăng ký để nhận link đặt lại mật khẩu</p>
        </div>

        <form id="forgotForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-1">Email</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-red-600"
                    placeholder="email@example.com"/>
            </div>
            <button type="submit" id="submitBtn"
                class="w-full bg-black text-white font-bold uppercase tracking-widest py-3 hover:bg-red-600 transition">
                Gửi link đặt lại
            </button>
        </form>

        <div id="result" class="hidden mt-6 bg-green-50 border border-green-200 rounded-lg p-4">
            <div class="text-green-700 font-bold text-sm mb-2">✅ Link đã được tạo</div>
            <p class="text-xs text-gray-600 mb-3" id="resultMsg"></p>
            <div class="bg-white border border-gray-200 rounded p-3 mb-3">
                <div class="text-[10px] uppercase tracking-wider text-gray-500 mb-1">Link đặt lại (copy hoặc click):</div>
                <a id="resetLink" href="#" class="text-xs text-red-600 break-all hover:underline" target="_blank"></a>
            </div>
            <div class="text-[10px] text-gray-400 italic">
                ⚠️ Demo: link hiển thị trực tiếp do chưa tích hợp SMTP. Production sẽ gửi qua email.
            </div>
        </div>

        <div id="error" class="hidden mt-4 bg-red-50 border border-red-200 rounded-lg p-3 text-red-600 text-sm"></div>

        <div class="mt-6 text-center text-sm">
            <a href="index.html" class="text-gray-600 hover:text-red-600">← Quay lại trang chủ</a>
        </div>
    </div>

    <script>
        const API_HOST = window.location.origin;
        document.getElementById('forgotForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errBox = document.getElementById('error');
            const resBox = document.getElementById('result');
            btn.disabled = true; btn.textContent = 'Đang gửi...';
            errBox.classList.add('hidden'); resBox.classList.add('hidden');

            try {
                const r = await fetch(API_HOST + '/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const data = await r.json();
                if (!r.ok) throw new Error(data.message || 'Có lỗi xảy ra');

                document.getElementById('resultMsg').textContent = data.message;
                if (data.resetUrl) {
                    const fullUrl = API_HOST + data.resetUrl;
                    const link = document.getElementById('resetLink');
                    link.href = fullUrl;
                    link.textContent = fullUrl;
                }
                resBox.classList.remove('hidden');
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false; btn.textContent = 'Gửi link đặt lại';
            }
        };
    </script>
</body>
</html>
